[package]
name = "typesake-core"
version = "0.1.0"
edition = "2021"
description = "Typesake Android offline language engine: pinyin candidates, Chinese->English suggestion, save & grammar"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "typesake_core"

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
strip = true
