name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 门禁 1：Rust 引擎（格式 / lint / 单测）
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path rust-core/Cargo.toml --release

  # 门禁 2：Android（Kotlin 单测 + lint + APK）
  build-apk:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (runner already has SDK)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust .so for 3 ABIs
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -o ../app/src/main/jniLibs \
            -t armeabi-v7a -t arm64-v8a -t x86_64 \
            build --release
          # cargo-ndk 会把依赖中的 cdylib 一起拷进来，只保留本引擎，避免 APK 膨胀
          find ../app/src/main/jniLibs -name '*.so' ! -name 'libtypesake_core.so' -delete
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Kotlin unit tests + lint + assembleDebug
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typesake-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports (tests / lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
