name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests (language engine)
        run: cargo test --manifest-path rust-core/Cargo.toml

  build-apk:
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK + platform (runner already has SDK)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust .so for 3 ABIs
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -o ../app/src/main/jniLibs \
            -t armeabi-v7a -t arm64-v8a -t x86_64 \
            build --release
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typesake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
