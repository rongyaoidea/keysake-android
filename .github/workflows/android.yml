name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# 三个 job 相互独立、并行：
# - rust : 引擎质量门禁（fmt / clippy / 单测）
# - test : Kotlin 单测 + lint（失败只让本 job 变红，不阻塞产物）
# - apk  : 只负责产出可安装 APK（.so 构建失败也照常出包，走 Kotlin 兜底）
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path rust-core/Cargo.toml --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 失败即 red（本 job 负责暴露问题），但不影响 apk job 出包
      - name: Kotlin unit tests + lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload test / lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      # ---- 引擎 .so：失败不阻塞出包（APK 会走 Kotlin 兜底，仍可用）----
      - name: Install cargo-ndk
        continue-on-error: true
        run: cargo install cargo-ndk --locked

      - name: Build Rust .so for 3 ABIs
        continue-on-error: true
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # arm64 独享 trigrams（联想更准，体积 +13.5MB）；其余 ABI 不带
          if [ "1" = "1" ]; then
            cargo ndk -o ../app/src/main/jniLibs -t arm64-v8a build --release --features trigrams
          fi
          cargo ndk -o ../app/src/main/jniLibs \
            -t armeabi-v7a -t x86_64 \
            build --release
          # cargo-ndk 会把依赖中的 cdylib 一起拷进来，只保留本引擎
          find ../app/src/main/jniLibs -name '*.so' ! -name 'libtypesake_core.so' -delete
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Check engine presence
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app/src/main/jniLibs/$abi/libtypesake_core.so" ]; then
              echo "engine: $abi present"
            else
              echo "engine: $abi MISSING"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning title=Rust engine incomplete::有 ABI 缺 libtypesake_core.so，真机可能显示「引擎未加载」"
          fi

      - name: Assert APK contains all ABIs
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$abi/libtypesake_core.so"; then
              echo "apk: $abi ok"
            else
              echo "::error title=APK missing ABI::$abi 未打进 APK"
              exit 1
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 只做构建，不跑测试：测试在 test job 里，失败也不影响这里出包
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -x lint -x test

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typesake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
